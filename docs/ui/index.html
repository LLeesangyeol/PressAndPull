<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press & Pull UI Mockup</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #eef4f2; color: #15201b; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .phone { background: #f7faf8; border: 1px solid #d6dfda; border-radius: 8px; padding: 16px; min-height: 420px; }
    .card { background: #fff; border: 1px solid #dfe7e2; border-radius: 8px; padding: 12px; margin: 10px 0; }
    .nav { display: flex; justify-content: space-between; border-top: 1px solid #d6dfda; padding-top: 10px; margin-top: 16px; font-size: 12px; }
    .fab { width: 44px; height: 44px; border-radius: 50%; background: #236b4e; color: white; display: grid; place-items: center; float: right; }
    .chip { display: inline-block; border: 1px solid #b7c9bf; border-radius: 999px; padding: 4px 10px; margin: 4px 4px 4px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Press & Pull</h1>
    <p>운동 기록, 루틴 추천, 인바디 기록 앱 UI 목업</p>
    <section class="grid">
      <article class="phone">
        <h2>Home</h2>
        <div class="card">운동 기록 12</div>
        <div class="card">총 볼륨 18,420 kg</div>
        <div class="card"><strong>오늘의 추천</strong><br>Pull Strength</div>
        <div class="nav"><span>Home</span><span>Workouts</span><span>Routine</span><span>InBody</span></div>
      </article>
      <article class="phone">
        <h2>Workouts</h2>
        <div class="card">Bench Press<br>4세트 x 8회 x 60kg</div>
        <div class="card">Pull Up<br>4세트 x 6회</div>
        <div class="fab">+</div>
      </article>
      <article class="phone">
        <h2>Routine</h2>
        <span class="chip">등/이두 집중</span>
        <div class="card">Pull Up 4세트<br>Barbell Row 4x8<br>Face Pull 3x15</div>
      </article>
      <article class="phone">
        <h2>InBody</h2>
        <div class="card">2026-06-04<br>72.4kg / 골격근 34.1kg / 체지방 17.8%</div>
        <div class="fab">+</div>
      </article>
    </section>
  </main>
</body>
</html>
